<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Никах — Ибрагим & Наиля</title>

    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Cormorant Garamond', serif; background: #fdf8ef; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; text-align: center; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3rem; color: #1a3c34; }
        button { margin: 10px; padding: 10px 20px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 400px; width: 100%; }
        .hidden { display: none; }
        .guest-list { list-style: none; padding: 0; }
        .guest-list li { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ибрагим & Наиля</h1>
    <p>Никах — 27 сентября 2026, 11:00</p>

    <h2>Подтверждение присутствия</h2>
    <form id="guestForm">
        <input type="text" id="guestName" placeholder="Ваше имя" required><br><br>
        <input type="tel" id="guestPhone" placeholder="Номер телефона" required><br><br>
        <button type="submit">Я приду</button>
        <div id="successMessage" style="display:none; color:green;">Спасибо!</div>
        <div id="errorMessage" style="display:none; color:red;"></div>
    </form>
</div>

<!-- Кнопки доступа -->
<button onclick="openAdmin()" style="position:fixed; bottom:20px; right:20px;">⚙️</button>
<button onclick="openCouple()" style="position:fixed; bottom:20px; left:20px;">💑</button>

<!-- Модальные окна -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <h3>Вход для администратора</h3>
        <input type="password" id="adminPass" placeholder="Пароль"><br><br>
        <button onclick="loginAdmin()">Войти</button>
        <button onclick="closeModal('adminModal')">Закрыть</button>
        <div id="adminPanel" class="hidden">
            <hr>
            <h3>Список гостей</h3>
            <p>Всего: <span id="totalGuests">0</span></p>
            <ul id="guestList" class="guest-list"></ul>
            <button onclick="clearGuests()">Очистить данные</button>
        </div>
    </div>
</div>

<div class="modal" id="coupleModal">
    <div class="modal-content">
        <h3>Вход для жениха и невесты</h3>
        <input type="password" id="couplePass" placeholder="Пароль"><br><br>
        <button onclick="loginCouple()">Войти</button>
        <button onclick="closeModal('coupleModal')">Закрыть</button>
        <div id="couplePanel" class="hidden">
            <hr>
            <h3>Список гостей</h3>
            <p>Всего: <span id="coupleTotalGuests">0</span></p>
            <ul id="coupleGuestList" class="guest-list"></ul>
        </div>
    </div>
</div>

<script>
    // ВАЖНО: Вставьте сюда ваш firebaseConfig
    const firebaseConfig = {
  apiKey: "AIzaSyDeQB5i5wQlPIukdOpOORS1vdcVBaX-Tbk",
  authDomain: "nikah-invitations.firebaseapp.com",
  databaseURL: "https://nikah-invitations-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nikah-invitations",
  storageBucket: "nikah-invitations.firebasestorage.app",
  messagingSenderId: "408413734731",
  appId: "1:408413734731:web:8b96663010877951f30ace"
};

    // Пароли
    const ADMIN_PASSWORD = 'admin123';
    const COUPLE_PASSWORD = 'nikah2026';

    // DOM-элементы
    const guestForm = document.getElementById('guestForm');
    const guestName = document.getElementById('guestName');
    const guestPhone = document.getElementById('guestPhone');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');

    // === ФОРМА РЕГИСТРАЦИИ ===
    guestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = guestName.value.trim();
        const phone = guestPhone.value.trim();

        if (!name || !phone) {
            errorMessage.textContent = 'Заполните все поля';
            errorMessage.style.display = 'block';
            return;
        }

        try {
            // Проверка дубликатов
            const snapshot = await database.ref('guests').once('value');
            const guests = [];
            snapshot.forEach(child => guests.push(child.val()));

            const duplicate = guests.some(g => 
                g.name.toLowerCase() === name.toLowerCase() || 
                g.phone.replace(/\D/g,'') === phone.replace(/\D/g,'')
            );

            if (duplicate) {
                errorMessage.textContent = 'Вы уже зарегистрированы';
                errorMessage.style.display = 'block';
                return;
            }

            await database.ref('guests').push({
                name,
                phone,
                date: new Date().toISOString(),
                status: 'confirmed'
            });

            guestName.disabled = true;
            guestPhone.disabled = true;
            guestForm.querySelector('button[type="submit"]').disabled = true;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';

            setTimeout(() => successMessage.style.display = 'none', 5000);
        } catch (err) {
            console.error(err);
            errorMessage.textContent = 'Ошибка: ' + err.message;
            errorMessage.style.display = 'block';
        }
    });

    // === ОБЩИЕ ФУНКЦИИ ===
    function openAdmin() {
        document.getElementById('adminModal').classList.add('active');
    }
    function openCouple() {
        document.getElementById('coupleModal').classList.add('active');
    }
    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    // === АДМИН ===
    function loginAdmin() {
        const pass = document.getElementById('adminPass').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('adminPanel').classList.remove('hidden');
            loadAdminGuests();
        } else {
            alert('Неверный пароль');
        }
    }

    // === ЖЕНИХ И НЕВЕСТА ===
    function loginCouple() {
        const pass = document.getElementById('couplePass').value;
        if (pass === COUPLE_PASSWORD) {
            document.getElementById('couplePanel').classList.remove('hidden');
            loadCoupleGuests();
        } else {
            alert('Неверный пароль');
        }
    }

    // === ЗАГРУЗКА СПИСКОВ ===
    function loadAdminGuests() {
        database.ref('guests').on('value', (snapshot) => {
            const guests = [];
            snapshot.forEach(child => guests.push(child.val()));
            guests.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('totalGuests').textContent = guests.length;
            const list = document.getElementById('guestList');
            list.innerHTML = '';
            if (guests.length === 0) {
                list.innerHTML = '<li>Пока нет записей</li>';
            } else {
                guests.forEach(g => {
                    const li = document.createElement('li');
                    li.textContent = `${g.name} — ${g.phone} (${new Date(g.date).toLocaleString('ru-RU')})`;
                    list.appendChild(li);
                });
            }
        });
    }

    function loadCoupleGuests() {
        database.ref('guests').on('value', (snapshot) => {
            const guests = [];
            snapshot.forEach(child => guests.push(child.val()));
            guests.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('coupleTotalGuests').textContent = guests.length;
            const list = document.getElementById('coupleGuestList');
            list.innerHTML = '';
            if (guests.length === 0) {
                list.innerHTML = '<li>Пока нет записей</li>';
            } else {
                guests.forEach(g => {
                    const li = document.createElement('li');
                    li.textContent = `${g.name} — ${g.phone} (${new Date(g.date).toLocaleString('ru-RU')})`;
                    list.appendChild(li);
                });
            }
        });
    }

    function clearGuests() {
        if (confirm('Удалить все данные?') && confirm('Точно?')) {
            database.ref('guests').remove();
        }
    }
</script>
</body>
</html>
